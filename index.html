<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Mini LoL</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;user-select:none}
  body{overflow:hidden;background:#0a1428;font-family:'Malgun Gothic',sans-serif;color:#f0e6d2}
  canvas{display:block}
  #top{position:absolute;top:10px;right:10px;background:rgba(1,10,19,.88);border:1px solid #c8aa6e;padding:8px 14px;border-radius:6px;display:flex;gap:16px;font-size:14px;font-weight:bold}
  #guide{position:absolute;top:10px;left:10px;background:rgba(1,10,19,.8);border:1px solid #463714;padding:8px 12px;border-radius:6px;font-size:12px;line-height:1.5}
  #hud{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:12px;background:rgba(1,10,19,.92);padding:12px 16px;border-radius:10px;border:2px solid #c8aa6e}
  #stats{font-size:12px;line-height:1.6;min-width:105px;border-right:1px solid #463714;padding-right:10px}
  .row{display:flex;gap:7px;align-items:center}
  .slot{width:48px;height:48px;background:#1e2328;border:2px solid #c8aa6e;border-radius:6px;position:relative;display:flex;align-items:center;justify-content:center;font-weight:bold}
  .spell{width:36px;height:36px;border-color:#0ac8b9;font-size:12px}
  .key{position:absolute;bottom:1px;right:4px;font-size:10px;color:#c8aa6e}
  .cd{position:absolute;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;font-size:15px;color:#fff;border-radius:4px}
  #bars{display:flex;flex-direction:column;gap:4px;margin-top:7px}
  .bar{width:240px;height:15px;background:#111;border:1px solid #463714;border-radius:3px;position:relative;overflow:hidden}
  #hp{height:100%;background:#2ecc71;width:100%}
  #mp{height:100%;background:#3498db;width:100%}
  .btxt{position:absolute;inset:0;text-align:center;font-size:11px;line-height:14px;font-weight:bold;text-shadow:1px 1px 1px #000}
  #shop{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:430px;background:rgba(1,10,19,.97);border:2px solid #c8aa6e;border-radius:10px;padding:18px;z-index:50}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .item{background:#1e2328;border:1px solid #463714;padding:9px;border-radius:6px;cursor:pointer}
  .item:hover{border-color:#c8aa6e}
  #end{display:none;position:absolute;inset:0;background:rgba(0,0,0,.82);align-items:center;justify-content:center;flex-direction:column;z-index:99}
  #end h1{font-size:52px;color:#c8aa6e;margin-bottom:18px}
  #end button{padding:10px 24px;font-size:16px;background:#1e2328;color:#c8aa6e;border:2px solid #c8aa6e;cursor:pointer;border-radius:6px}
</style>
</head>
<body oncontextmenu="return false;">
<div id="guide">
  <b>[롤 조작법]</b> <b>좌클릭/우클릭</b>: 이동 및 적 공격 | <b>S</b>: 정지 | <b>Space</b>: 카메라 고정<br>
  <b>Q</b>: 관통 화살 | <b>W</b>: 공속/이속 버프 | <b>E</b>: 비전 이동 | <b>R</b>: 초장거리 궁극기 | <b>D</b>: 유체화 | <b>F</b>: 점멸 | <b>B</b>: 귀환 | <b>P</b>: 상점
</div>
<div id="top">
  <span>K/D: <b id="kd">0 / 0</b></span>
  <span>CS: <b id="cs">0</b></span>
  <span style="color:#f1c40f">골드: <b id="gold">500</b> G</span>
</div>
<div id="shop">
  <div style="display:flex;justify-content:space-between;color:#c8aa6e;font-weight:bold">
    <span>아이템 상점 (우물 근처 구매 가능)</span><span style="cursor:pointer" onclick="toggleShop()">✕</span>
  </div>
  <div class="grid" id="items"></div>
</div>
<div id="hud">
  <div id="stats">
    <div>Lv.<b id="lv">1</b> (<span id="xp">0</span>%)</div>
    <div>공격력: <b id="ad">60</b></div>
    <div>주문력: <b id="ap">0</b></div>
    <div>이동속도: <b id="ms">330</b></div>
  </div>
  <div>
    <div class="row">
      <div class="slot">Q<span class="key">Q</span><div class="cd" id="cd-q"></div></div>
      <div class="slot">W<span class="key">W</span><div class="cd" id="cd-w"></div></div>
      <div class="slot">E<span class="key">E</span><div class="cd" id="cd-e"></div></div>
      <div class="slot">R<span class="key">R</span><div class="cd" id="cd-r"></div></div>
      <div class="slot spell">유체<span class="key">D</span><div class="cd" id="cd-d"></div></div>
      <div class="slot spell">점멸<span class="key">F</span><div class="cd" id="cd-f"></div></div>
      <div class="slot spell" style="border-color:#c8aa6e">귀환<span class="key">B</span></div>
    </div>
    <div id="bars">
      <div class="bar"><div id="hp"></div><div class="btxt" id="hpt">600 / 600</div></div>
      <div class="bar"><div id="mp"></div><div class="btxt" id="mpt">350 / 350</div></div>
    </div>
  </div>
</div>
<div id="end"><h1 id="endt">승리!</h1><button onclick="location.reload()">다시 시작</button></div>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
c.width = innerWidth; c.height = innerHeight;
const MAP = 2200;
let cam = {x:0, y:0, lock:true}, mouse = {x:0, y:0, wx:0, wy:0}, over = false;
const bushes = [{x:700,y:1400,r:65},{x:800,y:1300,r:65},{x:1300,y:800,r:65},{x:1400,y:700,r:65},{x:1050,y:1050,r:75}];
const shopData = [
  {n:"도란의 검",d:"공격력 +15, 체력 +80",g:450,ad:15,ap:0,hp:80,ms:0},
  {n:"장화",d:"이동속도 +45",g:300,ad:0,ap:0,hp:0,ms:45},
  {n:"B.F. 대검",d:"공격력 +40",g:1300,ad:40,ap:0,hp:0,ms:0},
  {n:"큰 지팡이",d:"주문력 +60",g:1250,ad:0,ap:60,hp:0,ms:0},
  {n:"무한의 대검",d:"공격력 +75, 체력 +150",g:3400,ad:75,ap:0,hp:150,ms:0},
  {n:"라바돈 모자",d:"주문력 +120",g:3600,ad:0,ap:120,hp:0,ms:0}
];
const p = {
  team:'blue', x:260, y:1940, tx:260, ty:1940, r:20, hp:600, mhp:600, mp:350, mmp:350,
  ad:60, ap:0, ms:330, rng:250, atkCd:0, lv:1, xp:0, mxp:100, gold:500, k:0, d:0, cs:0,
  target:null, recall:0, bush:false, respawn:0,
  cd:{q:0,w:0,e:0,r:0,d:0,f:0}, mcd:{q:2.5,w:7,e:6,r:16,d:22,f:35}, buff:{w:0,d:0}
};
let structs = [
  {team:'blue',type:'nexus',x:220,y:1980,r:50,hp:3000,mhp:3000,rng:0,ad:0,cd:0},
  {team:'blue',type:'tower',x:600,y:1600,r:32,hp:1500,mhp:1500,rng:300,ad:105,cd:0},
  {team:'blue',type:'tower',x:920,y:1280,r:32,hp:1500,mhp:1500,rng:300,ad:105,cd:0},
  {team:'red',type:'nexus',x:1980,y:220,r:50,hp:3000,mhp:3000,rng:0,ad:0,cd:0},
  {team:'red',type:'tower',x:1600,y:600,r:32,hp:1500,mhp:1500,rng:300,ad:105,cd:0},
  {team:'red',type:'tower',x:1280,y:920,r:32,hp:1500,mhp:1500,rng:300,ad:105,cd:0}
];
const ai = {team:'red',x:1940,y:260,r:20,hp:650,mhp:650,ad:62,ms:315,rng:240,atkCd:0,qCd:0,respawn:0};
let minions=[], projs=[], marks=[], texts=[];

shopData.forEach((it,i)=>{
  const d=document.createElement('div'); d.className='item';
  d.innerHTML=`<b>${it.n}</b><div style="font-size:11px;color:#aaa;margin:3px 0">${it.d}</div><span style="color:#f1c40f;font-size:12px">${it.g} G</span>`;
  d.onclick=()=>{
    if(Math.hypot(p.x-220,p.y-1980)>320) return addTxt(p.x,p.y-25,"우물 근처에서만 구매 가능!","#e74c3c");
    if(p.gold<it.g) return addTxt(p.x,p.y-25,"골드 부족!","#e74c3c");
    p.gold-=it.g; p.ad+=it.ad; p.ap+=it.ap; p.mhp+=it.hp; p.hp+=it.hp; p.ms+=it.ms;
    addTxt(p.x,p.y-25,`${it.n} 구매!`,"#f1c40f");
  };
  document.getElementById('items').appendChild(d);
});
function toggleShop(){const s=document.getElementById('shop');s.style.display=s.style.display==='block'?'none':'block';}
function addTxt(x,y,t,col){texts.push({x,y,t,col,life:45});}
function gainXp(v){
  p.xp+=v;
  if(p.xp>=p.mxp){p.xp-=p.mxp;p.lv++;p.mxp=Math.floor(p.mxp*1.25);p.mhp+=90;p.hp+=90;p.mmp+=40;p.mp+=40;p.ad+=5;addTxt(p.x,p.y-35,`LEVEL UP! Lv.${p.lv}`,"#2ecc71");}
}
function spawnWave(){
  if(over) return;
  for(let i=0;i<3;i++) setTimeout(()=>{
    minions.push({team:'blue',x:340,y:1860,r:12,hp:220,mhp:220,ad:22,rng:105,cd:0,spd:1.7});
    minions.push({team:'red',x:1860,y:340,r:12,hp:220,mhp:220,ad:22,rng:105,cd:0,spd:1.7});
  },i*450);
}
spawnWave(); setInterval(spawnWave,13000);

window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.wx=mouse.x+cam.x;mouse.wy=mouse.y+cam.y;});
window.addEventListener('mousedown',e=>{
  if(e.target.closest('#shop')||e.target.closest('#hud')) return;
  if((e.button===0||e.button===2)&&p.respawn<=0){
    p.recall=0;
    const wx=e.clientX+cam.x, wy=e.clientY+cam.y;
    const ens=[...(ai.respawn<=0?[ai]:[]),...minions.filter(m=>m.team==='red'),...structs.filter(s=>s.team==='red'&&s.hp>0)];
    let hit=ens.find(en=>Math.hypot(wx-en.x,wy-en.y)<=en.r+14);
    if(hit){p.target=hit;marks.push({x:hit.x,y:hit.y,col:'#e74c3c',a:1});}
    else{p.target=null;p.tx=Math.max(30,Math.min(MAP-30,wx));p.ty=Math.max(30,Math.min(MAP-30,wy));marks.push({x:p.tx,y:p.ty,col:'#2ecc71',a:1});}
  }
});

window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='s'){p.tx=p.x;p.ty=p.y;p.target=null;return;}
  if(k===' '){cam.lock=!cam.lock;return;}
  if(k==='p'){toggleShop();return;}
  if(p.respawn>0) return;
  if(k==='b'){p.recall=4;p.tx=p.x;p.ty=p.y;p.target=null;addTxt(p.x,p.y-25,"귀환 중 (4초)...","#3498db");return;}
  const ang=Math.atan2(mouse.wy-p.y,mouse.wx-p.x);
  if(k==='q'&&p.cd.q<=0&&p.mp>=30){p.mp-=30;p.cd.q=p.mcd.q;p.recall=0;projs.push({team:'blue',x:p.x,y:p.y,vx:Math.cos(ang)*14,vy:Math.sin(ang)*14,r:8,dmg:p.ad*1.2+p.ap*0.8+45,life:55,col:'#00cec9',pierce:false});}
  if(k==='w'&&p.cd.w<=0&&p.mp>=40){p.mp-=40;p.cd.w=p.mcd.w;p.buff.w=3.5;addTxt(p.x,p.y-25,"공속/이속 증가!","#f1c40f");}
  if(k==='e'&&p.cd.e<=0&&p.mp>=50){p.mp-=50;p.cd.e=p.mcd.e;p.recall=0;const d=Math.min(190,Math.hypot(mouse.wx-p.x,mouse.wy-p.y));p.x+=Math.cos(ang)*d;p.y+=Math.sin(ang)*d;p.tx=p.x;p.ty=p.y;}
  if(k==='r'&&p.cd.r<=0&&p.mp>=100){p.mp-=100;p.cd.r=p.mcd.r;p.recall=0;projs.push({team:'blue',x:p.x,y:p.y,vx:Math.cos(ang)*17,vy:Math.sin(ang)*17,r:26,dmg:p.ad*1.5+p.ap*1.2+190,life:130,col:'#f39c12',pierce:true});}
  if(k==='d'&&p.cd.d<=0){p.cd.d=p.mcd.d;p.buff.d=6;addTxt(p.x,p.y-25,"유체화!","#74b9ff");}
  if(k==='f'&&p.cd.f<=0){p.cd.f=p.mcd.f;p.recall=0;p.x+=Math.cos(ang)*220;p.y+=Math.sin(ang)*220;p.tx=p.x;p.ty=p.y;addTxt(p.x,p.y-25,"점멸!","#ffeaa7");}
});

function update(){
  if(over) return;
  const dt=1/60;
  p.gold+=dt*2.5; p.mp=Math.min(p.mmp,p.mp+dt*7);
  if(Math.hypot(p.x-220,p.y-1980)<240&&p.respawn<=0){p.hp=Math.min(p.mhp,p.hp+dt*160);p.mp=Math.min(p.mmp,p.mp+dt*160);}
  for(let k in p.cd){
    if(p.cd[k]>0) p.cd[k]=Math.max(0,p.cd[k]-dt);
    const el=document.getElementById('cd-'+k);
    if(p.cd[k]>0){el.style.display='flex';el.innerText=Math.ceil(p.cd[k]);}else el.style.display='none';
  }
  if(p.buff.w>0) p.buff.w-=dt; if(p.buff.d>0) p.buff.d-=dt; if(p.atkCd>0) p.atkCd-=dt;
  p.bush=bushes.some(b=>Math.hypot(p.x-b.x,p.y-b.y)<b.r);

  if(p.respawn>0){p.respawn-=dt;if(p.respawn<=0){p.x=260;p.y=1940;p.tx=260;p.ty=1940;p.hp=p.mhp;p.mp=p.mmp;}}
  else{
    if(p.recall>0){p.recall-=dt;if(p.recall<=0){p.x=260;p.y=1940;p.tx=260;p.ty=1940;addTxt(p.x,p.y-25,"귀환 완료!","#3498db");}}
    const spd=(p.ms/60)*(p.buff.w>0?1.25:1)*(p.buff.d>0?1.35:1);
    if(p.target&&p.target.hp>0&&(!p.target.respawn||p.target.respawn<=0)){
      const dist=Math.hypot(p.target.x-p.x,p.target.y-p.y);
      if(dist<=p.rng+p.target.r){
        if(p.atkCd<=0){
          p.atkCd=1/(p.buff.w>0?1.5:1.0);
          const a=Math.atan2(p.target.y-p.y,p.target.x-p.x);
          projs.push({team:'blue',x:p.x,y:p.y,vx:Math.cos(a)*15,vy:Math.sin(a)*15,r:5,dmg:p.ad,life:30,col:'#ffeaa7',pierce:false,homing:p.target});
        }
      }else{const a=Math.atan2(p.target.y-p.y,p.target.x-p.x);p.x+=Math.cos(a)*spd;p.y+=Math.sin(a)*spd;}
    }else{
      p.target=null;
      const dx=p.tx-p.x, dy=p.ty-p.y, dist=Math.hypot(dx,dy);
      if(dist>spd){p.x+=(dx/dist)*spd;p.y+=(dy/dist)*spd;}
    }
  }

  // 적 AI 챔피언
  if(ai.respawn>0){ai.respawn-=dt;if(ai.respawn<=0){ai.x=1940;ai.y=260;ai.hp=ai.mhp;}}
  else{
    if(ai.atkCd>0) ai.atkCd-=dt; if(ai.qCd>0) ai.qCd-=dt;
    const targets=[...(p.respawn<=0&&!p.bush?[p]:[]),...minions.filter(m=>m.team==='blue'),...structs.filter(s=>s.team==='blue'&&s.hp>0)];
    let near=targets.sort((a,b)=>Math.hypot(a.x-ai.x,a.y-ai.y)-Math.hypot(b.x-ai.x,b.y-ai.y))[0];
    if(near){
      const d=Math.hypot(near.x-ai.x,near.y-ai.y), a=Math.atan2(near.y-ai.y,near.x-ai.x);
      if(d<450&&ai.qCd<=0){ai.qCd=4;projs.push({team:'red',x:ai.x,y:ai.y,vx:Math.cos(a)*12,vy:Math.sin(a)*12,r:8,dmg:ai.ad*1.2+35,life:45,col:'#ff7675',pierce:false});}
      if(d<=ai.rng+near.r){if(ai.atkCd<=0){ai.atkCd=1.1;projs.push({team:'red',x:ai.x,y:ai.y,vx:Math.cos(a)*14,vy:Math.sin(a)*14,r:5,dmg:ai.ad,life:30,col:'#fab1a0',pierce:false,homing:near});}}
      else{ai.x+=Math.cos(a)*(ai.ms/60);ai.y+=Math.sin(a)*(ai.ms/60);}
    }
  }

  // 미니언
  minions.forEach(m=>{
    if(m.cd>0) m.cd-=dt;
    const ens=m.team==='blue'?[...(ai.respawn<=0?[ai]:[]),...minions.filter(x=>x.team==='red'),...structs.filter(s=>s.team==='red'&&s.hp>0)]:[...(p.respawn<=0&&!p.bush?[p]:[]),...minions.filter(x=>x.team==='blue'),...structs.filter(s=>s.team==='blue'&&s.hp>0)];
    let near=ens.sort((a,b)=>Math.hypot(a.x-m.x,a.y-m.y)-Math.hypot(b.x-m.x,b.y-m.y))[0];
    if(near){
      const d=Math.hypot(near.x-m.x,near.y-m.y), a=Math.atan2(near.y-m.y,near.x-m.x);
      if(d<=m.rng+near.r){if(m.cd<=0){m.cd=1.2;near.hp-=m.ad;if(near===p){p.recall=0;if(p.hp<=0){p.d++;p.respawn=5;}}}}
      else{m.x+=Math.cos(a)*m.spd;m.y+=Math.sin(a)*m.spd;}
    }
  });

  // 포탑
  structs.forEach(s=>{
    if(s.hp<=0||s.type!=='tower') return;
    if(s.cd>0) s.cd-=dt;
    const ens=s.team==='blue'?[...minions.filter(m=>m.team==='red'),...(ai.respawn<=0?[ai]:[])]:[...minions.filter(m=>m.team==='blue'),...(p.respawn<=0&&!p.bush?[p]:[])];
    let near=ens.find(e=>Math.hypot(e.x-s.x,e.y-s.y)<=s.rng+e.r);
    if(near&&s.cd<=0){s.cd=1.3;const a=Math.atan2(near.y-s.y,near.x-s.x);projs.push({team:s.team,x:s.x,y:s.y,vx:Math.cos(a)*16,vy:Math.sin(a)*16,r:9,dmg:s.ad,life:35,col:s.team==='blue'?'#74b9ff':'#ff7675',pierce:false,homing:near});}
  });

  // 투사체 및 판정
  for(let i=projs.length-1;i>=0;i--){
    const pr=projs[i];
    if(pr.homing&&pr.homing.hp>0){const a=Math.atan2(pr.homing.y-pr.y,pr.homing.x-pr.x);pr.vx=Math.cos(a)*15;pr.vy=Math.sin(a)*15;}
    pr.x+=pr.vx; pr.y+=pr.vy; pr.life--;
    const ens=pr.team==='blue'?[...(ai.respawn<=0?[ai]:[]),...minions.filter(m=>m.team==='red'),...structs.filter(s=>s.team==='red'&&s.hp>0)]:[...(p.respawn<=0?[p]:[]),...minions.filter(m=>m.team==='blue'),...structs.filter(s=>s.team==='blue'&&s.hp>0)];
    for(let en of ens){
      if(Math.hypot(pr.x-en.x,pr.y-en.y)<=pr.r+en.r){
        en.hp-=pr.dmg;
        if(en===p){p.recall=0;if(p.hp<=0){p.d++;p.respawn=5;addTxt(p.x,p.y,"처치당했습니다!","#e74c3c");}}
        else if(en===ai&&ai.hp<=0){ai.respawn=7;p.k++;p.gold+=300;gainXp(120);addTxt(ai.x,ai.y,"적 처치! +300G","#f1c40f");}
        else if(en.hp<=0&&pr.team==='blue'){
          if(en.type==='tower'){p.gold+=250;gainXp(100);addTxt(en.x,en.y,"포탑 파괴! +250G","#f1c40f");}
          else if(!en.type){p.cs++;p.gold+=25;gainXp(30);addTxt(en.x,en.y,"+25G","#f1c40f");}
        }
        if(!pr.pierce){pr.life=0;break;}
      }
    }
    if(pr.life<=0) projs.splice(i,1);
  }
  minions=minions.filter(m=>m.hp>0);

  // 넥서스 승패 체크
  const bn=structs.find(s=>s.team==='blue'&&s.type==='nexus'), rn=structs.find(s=>s.team==='red'&&s.type==='nexus');
  if(rn.hp<=0){over=true;document.getElementById('endt').innerText="승리! (적 넥서스 파괴)";document.getElementById('end').style.display='flex';}
  if(bn.hp<=0){over=true;document.getElementById('endt').innerText="패배! (아군 넥서스 파괴)";document.getElementById('end').style.display='flex';}

  // 카메라 & UI
  if(cam.lock){cam.x=Math.max(0,Math.min(MAP-c.width,p.x-c.width/2));cam.y=Math.max(0,Math.min(MAP-c.height,p.y-c.height/2));}
  mouse.wx=mouse.x+cam.x; mouse.wy=mouse.y+cam.y;
  document.getElementById('kd').innerText=`${p.k} / ${p.d}`;
  document.getElementById('cs').innerText=p.cs;
  document.getElementById('gold').innerText=Math.floor(p.gold);
  document.getElementById('lv').innerText=p.lv;
  document.getElementById('xp').innerText=Math.floor(p.xp/p.mxp*100);
  document.getElementById('ad').innerText=p.ad;
  document.getElementById('ap').innerText=p.ap;
  document.getElementById('ms').innerText=p.ms;
  document.getElementById('hp').style.width=`${Math.max(0,p.hp/p.mhp*100)}%`;
  document.getElementById('mp').style.width=`${Math.max(0,p.mp/p.mmp*100)}%`;
  document.getElementById('hpt').innerText=`${Math.max(0,Math.ceil(p.hp))} / ${p.mhp}`;
  document.getElementById('mpt').innerText=`${Math.ceil(p.mp)} / ${p.mmp}`;
}

function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  ctx.save(); ctx.translate(-cam.x,-cam.y);
  // 잔디 & 3라인(탑/미드/바텀) & 강
  ctx.fillStyle='#1b3b2b'; ctx.fillRect(0,0,MAP,MAP);
  ctx.strokeStyle='#4a4238'; ctx.lineWidth=130;
  ctx.beginPath(); ctx.moveTo(220,1980); ctx.lineTo(1980,220); ctx.stroke(); // 미드
  ctx.beginPath(); ctx.moveTo(220,1980); ctx.lineTo(220,220); ctx.lineTo(1980,220); ctx.stroke(); // 탑
  ctx.beginPath(); ctx.moveTo(220,1980); ctx.lineTo(1980,1980); ctx.lineTo(1980,220); ctx.stroke(); // 바텀
  ctx.strokeStyle='rgba(41,128,185,0.45)'; ctx.lineWidth=110;
  ctx.beginPath(); ctx.moveTo(220,220); ctx.lineTo(1980,1980); ctx.stroke(); // 강가

  // 부쉬
  ctx.fillStyle='rgba(39,174,96,0.75)';
  bushes.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();});

  // 클릭 마커
  marks.forEach((m,i)=>{ctx.strokeStyle=m.col;ctx.globalAlpha=m.a;ctx.beginPath();ctx.arc(m.x,m.y,18*(1.4-m.a),0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;m.a-=0.04;if(m.a<=0)marks.splice(i,1);});

  // 구조물
  structs.forEach(s=>{
    if(s.hp<=0) return;
    ctx.fillStyle=s.team==='blue'?'#2980b9':'#c0392b';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#c8aa6e';ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='#000';ctx.fillRect(s.x-30,s.y-s.r-14,60,7);
    ctx.fillStyle='#2ecc71';ctx.fillRect(s.x-30,s.y-s.r-14,60*(s.hp/s.mhp),7);
  });

  // 미니언
  minions.forEach(m=>{
    ctx.fillStyle=m.team==='blue'?'#3498db':'#e74c3c';
    ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.fillRect(m.x-14,m.y-20,28,4);
    ctx.fillStyle='#2ecc71';ctx.fillRect(m.x-14,m.y-20,28*(m.hp/m.mhp),4);
  });

  // 적 AI
  if(ai.respawn<=0){
    ctx.fillStyle='#e74c3c';ctx.beginPath();ctx.arc(ai.x,ai.y,ai.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#000';ctx.fillRect(ai.x-25,ai.y-32,50,6);
    ctx.fillStyle='#e74c3c';ctx.fillRect(ai.x-25,ai.y-32,50*(ai.hp/ai.mhp),6);
  }

  // 플레이어
  if(p.respawn<=0){
    ctx.globalAlpha=p.bush?0.5:1;
    ctx.fillStyle='#0984e3';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#f1c40f';ctx.lineWidth=3;ctx.stroke();
    ctx.globalAlpha=1;
    ctx.fillStyle='#000';ctx.fillRect(p.x-25,p.y-32,50,6);
    ctx.fillStyle='#2ecc71';ctx.fillRect(p.x-25,p.y-32,50*(p.hp/p.mhp),6);
  }

  // 투사체 & 텍스트
  projs.forEach(pr=>{ctx.fillStyle=pr.col;ctx.beginPath();ctx.arc(pr.x,pr.y,pr.r,0,Math.PI*2);ctx.fill();});
  texts.forEach((t,i)=>{ctx.fillStyle=t.col;ctx.font='bold 14px sans-serif';ctx.fillText(t.t,t.x-30,t.y);t.y-=0.6;t.life--;if(t.life<=0)texts.splice(i,1);});
  ctx.restore();
}
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
