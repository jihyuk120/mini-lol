<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Mini LoL</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1e272e; font-family: sans-serif; color: white; user-select: none; }
        canvas { display: block; background: #2d3436; }
        #ui { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; border: 2px solid #c8aa6e; }
        .skill { width: 50px; height: 50px; background: #0984e3; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 5px; font-weight: bold; position: relative; }
        .cd { position: absolute; inset: 0; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; font-size: 18px; }
        #info { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 8px; }
    </style>
</head>
<body oncontextmenu="return false;">
    <div id="info">
        <b>조작법:</b> 마우스 우클릭(이동) | <b>Q</b>(논타겟 투사체) | <b>W</b>(이동속도 증가) | <b>E</b>(점멸/대시) | <b>R</b>(광역 궁극기)<br>
        <span id="score">처치한 미니언: 0</span>
    </div>
    <div id="ui">
        <div class="skill">Q<div class="cd" id="cd-q" style="display:none"></div></div>
        <div class="skill">W<div class="cd" id="cd-w" style="display:none"></div></div>
        <div class="skill">E<div class="cd" id="cd-e" style="display:none"></div></div>
        <div class="skill">R<div class="cd" id="cd-r" style="display:none"></div></div>
    </div>
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
        let score = 0;

        // 챔피언 상태
        const player = {
            x: canvas.width / 2, y: canvas.height / 2,
            targetX: canvas.width / 2, targetY: canvas.height / 2,
            radius: 20, baseSpeed: 3.5, speed: 3.5,
            cd: { q: 0, w: 0, e: 0, r: 0 },
            maxCd: { q: 2, w: 6, e: 4, r: 10 }
        };

        let projectiles = [];
        let enemies = [];
        let effects = [];
        let clickMarkers = [];

        // 마우스 이동 추적
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

        // 우클릭 이동
        window.addEventListener('mousedown', e => {
            if (e.button === 2) {
                player.targetX = e.clientX;
                player.targetY = e.clientY;
                clickMarkers.push({ x: e.clientX, y: e.clientY, alpha: 1 });
            }
        });

        // QWER 스킬 입력
        window.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

            if (key === 'q' && player.cd.q <= 0) {
                player.cd.q = player.maxCd.q;
                projectiles.push({ x: player.x, y: player.y, vx: Math.cos(angle) * 10, vy: Math.sin(angle) * 10, radius: 8, life: 60 });
            }
            if (key === 'w' && player.cd.w <= 0) {
                player.cd.w = player.maxCd.w;
                player.speed = player.baseSpeed * 1.8;
                effects.push({ type: 'buff', life: 120 });
                setTimeout(() => player.speed = player.baseSpeed, 2000);
            }
            if (key === 'e' && player.cd.e <= 0) {
                player.cd.e = player.maxCd.e;
                const dashDist = 150;
                player.x += Math.cos(angle) * dashDist;
                player.y += Math.sin(angle) * dashDist;
                player.targetX = player.x;
                player.targetY = player.y;
            }
            if (key === 'r' && player.cd.r <= 0) {
                player.cd.r = player.maxCd.r;
                effects.push({ type: 'ult', x: mouse.x, y: mouse.y, radius: 110, life: 30 });
                enemies.forEach(en => {
                    if (Math.hypot(en.x - mouse.x, en.y - mouse.y) < 110 + en.radius) en.hp -= 100;
                });
            }
        });

        // 적 미니언 생성
        setInterval(() => {
            const side = Math.floor(Math.random() * 4);
            let x = side === 0 ? 0 : side === 1 ? canvas.width : Math.random() * canvas.width;
            let y = side === 2 ? 0 : side === 3 ? canvas.height : Math.random() * canvas.height;
            enemies.push({ x, y, radius: 15, hp: 50, speed: 1.5 });
        }, 1500);

        function update() {
            // 쿨타임 감소
            for (let k in player.cd) {
                if (player.cd[k] > 0) player.cd[k] = Math.max(0, player.cd[k] - 1/60);
                const el = document.getElementById('cd-' + k);
                if (player.cd[k] > 0) { el.style.display = 'flex'; el.innerText = player.cd[k].toFixed(1); }
                else { el.style.display = 'none'; }
            }

            // 플레이어 이동
            const dx = player.targetX - player.x;
            const dy = player.targetY - player.y;
            const dist = Math.hypot(dx, dy);
            if (dist > player.speed) {
                player.x += (dx / dist) * player.speed;
                player.y += (dy / dist) * player.speed;
            }

            // 투사체 업데이트
            projectiles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life--;
                enemies.forEach(en => {
                    if (Math.hypot(p.x - en.x, p.y - en.y) < p.radius + en.radius) {
                        en.hp -= 50; p.life = 0;
                    }
                });
                if (p.life <= 0) projectiles.splice(i, 1);
            });

            // 적 이동 및 사망 처리
            enemies.forEach((en, i) => {
                const angle = Math.atan2(player.y - en.y, player.x - en.x);
                en.x += Math.cos(angle) * en.speed;
                en.y += Math.sin(angle) * en.speed;
                if (en.hp <= 0) {
                    enemies.splice(i, 1);
                    score++;
                    document.getElementById('score').innerText = `처치한 미니언: ${score}`;
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 클릭 표시
            clickMarkers.forEach((m, i) => {
                ctx.strokeStyle = `rgba(46, 204, 113, ${m.alpha})`;
                ctx.beginPath(); ctx.arc(m.x, m.y, 15 * (1.5 - m.alpha), 0, Math.PI * 2); ctx.stroke();
                m.alpha -= 0.04;
                if (m.alpha <= 0) clickMarkers.splice(i, 1);
            });

            // 궁극기 이펙트
            effects.forEach((ef, i) => {
                if (ef.type === 'ult') {
                    ctx.fillStyle = `rgba(231, 76, 60, ${ef.life / 30 * 0.5})`;
                    ctx.beginPath(); ctx.arc(ef.x, ef.y, ef.radius, 0, Math.PI * 2); ctx.fill();
                }
                ef.life--;
                if (ef.life <= 0) effects.splice(i, 1);
            });

            // 플레이어
            ctx.fillStyle = player.speed > player.baseSpeed ? '#f1c40f' : '#3498db';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

            // 투사체
            ctx.fillStyle = '#00cec9';
            projectiles.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill(); });

            // 적 미니언
            ctx.fillStyle = '#e74c3c';
            enemies.forEach(en => { ctx.beginPath(); ctx.arc(en.x, en.y, en.radius, 0, Math.PI * 2); ctx.fill(); });
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
